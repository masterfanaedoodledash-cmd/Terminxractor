name: Website Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site
          if [ -f index.html ]; then
            cp index.html _site/
          elif [ -d site ]; then
            cp -R site/. _site/
          elif [ -d public ]; then
            cp -R public/. _site/
          elif [ -f dist/index.html ]; then
            cp -R dist/. _site/
          else
            printf '%s\n' '<!doctype html><html><body><h1>Terminxractor</h1><p>No website files found yet.</p></body></html>' > _site/index.html
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
